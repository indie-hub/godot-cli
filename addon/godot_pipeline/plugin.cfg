[plugin]

name="Godot Pipeline"
description="Local bridge that reports editor status, the active scene tree, node properties (inspect-node), scene node search (query-nodes), engine class reflection (inspect-class), opens scenes (open-scene), and applies scene edits (rename-node, create-node, set-property, delete-node, save-scene) through the editor's undo/redo stack to the Godot Pipeline CLI over a loopback TCP socket."
author="Godot Pipeline"
version="0.5.0"
script="editor_plugin.gd"
