[plugin]

name="Godot Pipeline"
description="Local bridge that reports editor status, the active scene tree, node properties (inspect-node), scene node search (query-nodes), engine class reflection (inspect-class), the resource file inventory (list-resources), opens scenes (open-scene), and applies scene edits (rename-node, create-node, set-property, delete-node, connect-signal, set-group, set-unique-name, instantiate-scene, save-scene) through the editor's undo/redo stack to the Godot Pipeline CLI over a loopback TCP socket."
author="Godot Pipeline"
version="0.6.0"
script="editor_plugin.gd"
